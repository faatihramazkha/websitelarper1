<!DOCTYPE html>
<html>
<head> 
    <title>Belajar form</title>
</head>
<body>
    <h1>Form pendaftaran</h1>

    <form>
        <br>
        <input type="text" name="nama" placeholder="Nama Lengkap">
        <br>

        <br>
        <input type="email" name="email" placeholder="Email Anda">
        <br>

        <br>
        <input type="password" name="password" placeholder="Password">
        <br>

        <br>
        <input type="number" name="umur" placeholder="Umur">
        <br>

        <br>
        <input type="date" name="tanggal_lahir" placeholder="Tanggal Lahir">
        <br>

        <br>
        <input type="radio" name="gender" value="male"> Laki-laki
        <input type="radio" name="gender" value="female"> Perempuan
        <br>

        <br>
        <label>Hobi:</label>
        <input type="radio" name="hobi" value="membaca"> Membaca
        <input type="radio" name="hobi" value="menulis"> Menulis
        <input type="radio" name="hobi" value="bermain"> Bermain
        <br>

        <br>
        asal tempat <select name="kota">
            <option value="jakarta">Jakarta</option>
            <option value="bandung">Bandung</option>
            <option value="surabaya">Surabaya</option>
        </select>
        <br>

        <br>
        <textarea name="pesan" rows="4" cols="50"></textarea>
        <br>

        <br>
        <input type="submit" value="Kirim">
        <br>

        <br>
        <input type="reset" value="Reset">
        <br>

    </form>


</body>
</html>
